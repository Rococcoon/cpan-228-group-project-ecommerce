<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragment/head :: head('Shopping Cart')}"></head>

<body>

<header th:replace="~{fragment/header :: header}"></header>


<main class="container py-5">


<h1 class="mb-4">
    Shopping Cart
</h1>



<div th:if="${cart.items.isEmpty()}">

    <div class="card shadow-sm text-center p-5">

        <div class="display-1">
            🛒
        </div>

        <h2>
            Your cart is currently empty
        </h2>


        <a th:href="@{/shop}" 
           class="btn btn-primary mt-3">
            Continue Shopping
        </a>

    </div>

</div>





<div th:unless="${cart.items.isEmpty()}">


<div class="card shadow">


<div class="card-body">


<table class="table table-striped align-middle">


<thead class="table-dark">

<tr>

<th>
Product
</th>

<th>
Layout
</th>

<th>
Price
</th>

<th>
Quantity
</th>

<th>
Subtotal
</th>

<th>
Action
</th>

</tr>

</thead>




<tbody>


<tr th:each="item : ${cart.items}">


<td th:text="${item.product.name}">
Product
</td>



<td th:text="${item.product.layout}">
Layout
</td>



<td>

$
<span th:text="${item.product.price}">
0
</span>

</td>





<td>


<form th:action="@{/shop/cart/decrease/{id}(id=${item.id})}"
      method="post"
      style="display:inline">


<button class="btn btn-sm btn-secondary">
-
</button>


</form>




<span class="mx-2"
      th:text="${item.quantity}">
1
</span>




<form th:action="@{/shop/cart/increase/{id}(id=${item.id})}"
      method="post"
      style="display:inline">


<button class="btn btn-sm btn-secondary">
+
</button>


</form>



</td>





<td>

$

<span th:text="${item.subtotal}">
0
</span>

</td>





<td>


<form th:action="@{/shop/cart/remove/{id}(id=${item.id})}"
      method="post">


<button class="btn btn-danger btn-sm">

Remove

</button>


</form>


</td>



</tr>


</tbody>



</table>



<hr>



<div class="text-end">


<h4>

Total:

$

<span th:text="${cart.total}">
0
</span>


</h4>



<a th:href="@{/shop/checkout}"
   class="btn btn-success mt-3">

Proceed to Checkout

</a>


</div>



</div>


</div>



</div>


</main>



<footer th:replace="~{fragment/footer :: footer}"></footer>


</body>

</html>
