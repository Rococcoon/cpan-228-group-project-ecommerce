<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head
  th:replace="~{fragment/head :: head('Product Details')}">
</head>


<body>

<header th:replace="~{fragment/header :: header}"></header>


<main class="container py-5">


  <!-- Success Message -->
  <div
    class="alert alert-success alert-dismissible fade show"
    role="alert"
    th:if="${param.created != null}"
  >
    Keyboard saved successfully.

    <button
      type="button"
      class="btn-close"
      data-bs-dismiss="alert"
      aria-label="Close">
    </button>

  </div>



  <!-- Product Card -->
  <div class="card border-0 shadow-sm">

    <div class="row g-0">


      <!-- Product Image -->
      <div
        class="col-lg-5"
        th:if="${product.imageUrl != null and !product.imageUrl.isBlank()}"
      >

        <img
          th:src="${product.imageUrl}"
          th:alt="${product.name}"
          class="img-fluid rounded-start w-100 h-100"
          style="object-fit: cover; min-height:350px"
        />

      </div>



      <!-- Product Information -->
      <div
        th:class="${product.imageUrl != null and !product.imageUrl.isBlank()}
        ? 'col-lg-7'
        : 'col-12'"
      >

        <div class="card-body p-4 p-md-5">


          <h1
            class="mb-3"
            th:text="${product.name}">
            Keyboard Name
          </h1>



          <p
            class="lead text-muted"
            th:text="${product.description}">
            Product description
          </p>



          <hr class="my-4"/>



          <div class="row g-4">


            <div class="col-sm-6">

              <div class="text-muted small">
                Keyboard Layout
              </div>

              <div
                class="fw-semibold fs-5"
                th:text="${product.layout}">
                Corne
              </div>

            </div>



            <div class="col-sm-6">

              <div class="text-muted small">
                Number of Keys
              </div>

              <div
                class="fw-semibold fs-5"
                th:text="${product.keyCount}">
                42
              </div>

            </div>



            <div class="col-sm-6">

              <div class="text-muted small">
                Stock Quantity
              </div>

              <div
                class="fw-semibold fs-5"
                th:text="${product.stock}">
                10
              </div>

            </div>



            <div class="col-sm-6">

              <div class="text-muted small">
                Price
              </div>

              <div class="fw-semibold fs-5">

                $<span th:text="${product.price}">
                  199.99
                </span>

              </div>

            </div>



            <div class="col-sm-6">

              <div class="text-muted small">
                Date Added
              </div>

              <div
                class="fw-semibold"
                th:text="${product.createdAt}">
                2026-07-26T21:30
              </div>

            </div>


          </div>



          <!-- Add To Cart -->
          <div class="mt-5">

            <form
              th:action="@{/shop/cart/add/{id}(id=${product.id})}"
              method="post"
            >

              <button
                type="submit"
                class="btn btn-success btn-lg"
              >
                🛒 Add to Cart
              </button>

            </form>

          </div>




          <div class="d-flex flex-wrap gap-2 mt-4">


            <a
              th:href="@{/shop}"
              class="btn btn-primary"
            >
              Back to Shop
            </a>



            <a
              th:href="@{/products/new}"
              class="btn btn-outline-success"
            >
              Add Another Keyboard
            </a>


          </div>


        </div>

      </div>


    </div>

  </div>


</main>



<footer th:replace="~{fragment/footer :: footer}"></footer>


</body>

</html>
