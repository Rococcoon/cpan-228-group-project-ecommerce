<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragment/head :: head('Shop')}"></head>

  <body>
    <div th:replace="~{fragment/header :: header}"></div>

    <main class="container py-4">
      <h1 class="mb-4">Ctrl-Alt-Keeb Shop</h1>

      <!-- Search / Filter Form -->
      <div class="card border-0 shadow-sm p-4 mb-4 bg-light">
        <form method="get" action="/shop" class="row g-3 align-items-end">
          <!-- Preserve sorting/pagination settings -->
          <input type="hidden" name="sort" th:value="${sort}" />
          <input type="hidden" name="direction" th:value="${direction}" />
          <input type="hidden" name="size" th:value="${pageSize}" />

          <!-- Layout Filter -->
          <div class="col-md-4">
            <label class="form-label fw-bold text-muted small">
              Keyboard Layout
            </label>

            <select name="layout" class="form-select">
              <option value="" th:selected="${layout == ''}">
                All Layouts
              </option>

              <option value="Corne" th:selected="${layout == 'Corne'}">
                Corne
              </option>

              <option value="Lily58" th:selected="${layout == 'Lily58'}">
                Lily58
              </option>

              <option value="Sofle" th:selected="${layout == 'Sofle'}">
                Sofle
              </option>

              <option value="Ergodox" th:selected="${layout == 'Ergodox'}">
                Ergodox
              </option>

              <option
                value="Moonlander"
                th:selected="${layout == 'Moonlander'}"
              >
                Moonlander
              </option>
            </select>
          </div>

          <!-- Key Count Filter -->
          <div class="col-md-4">
            <label class="form-label fw-bold text-muted small">
              Number of Keys
            </label>

            <select name="keyCount" class="form-select">
              <option value="0" th:selected="${keyCount == 0}">
                Any Key Count
              </option>

              <option value="34" th:selected="${keyCount == 34}">
                34 Keys
              </option>

              <option value="42" th:selected="${keyCount == 42}">
                42 Keys
              </option>

              <option value="58" th:selected="${keyCount == 58}">
                58 Keys
              </option>

              <option value="60" th:selected="${keyCount == 60}">
                60 Keys
              </option>

              <option value="76" th:selected="${keyCount == 76}">
                76 Keys
              </option>
            </select>
          </div>

          <!-- Filter Type -->
          <div class="col-md-2">
            <label class="form-label fw-bold text-muted small"> Filter </label>

            <select name="filterType" class="form-select">
              <option value="all" th:selected="${filterType == 'all'}">
                All
              </option>

              <option value="layout" th:selected="${filterType == 'layout'}">
                Layout
              </option>

              <option
                value="keyCount"
                th:selected="${filterType == 'keyCount'}"
              >
                Key Count
              </option>

              <option
                value="layoutAndKeyCount"
                th:selected="${filterType == 'layoutAndKeyCount'}"
              >
                Both
              </option>
            </select>
          </div>

          <!-- Buttons -->
          <div class="col-md-2 d-flex gap-2">
            <button class="btn btn-success flex-grow-1">Search</button>

            <a href="/shop" class="btn btn-outline-secondary"> Reset </a>
          </div>
        </form>
      </div>

      <div class="row">
        <div class="col-md-4 mb-4" th:each="product : ${products.content}">
          <div class="card h-100 shadow-sm">
            <div class="card-body">
              <h5 class="card-title" th:text="${product.name}">
                Keyboard Name
              </h5>

              <p class="card-text" th:text="${product.description}">
                Product description
              </p>

              <div class="mb-2">
                <strong>Layout:</strong>
                <span th:text="${product.layout}"> Corne </span>
              </div>

              <div class="mb-2">
                <strong>Keys:</strong>
                <span th:text="${product.keyCount}"> 42 </span>
              </div>

              <div class="mb-2">
                <strong>Stock:</strong>
                <span th:text="${product.stock}"> 5 </span>
              </div>

              <div class="mb-3">
                <strong>$</strong>
                <span th:text="${product.price}"> 249.99 </span>
              </div>

              <a
                class="btn btn-primary"
                th:href="@{/shop/{id}(id=${product.id})}"
              >
                View Details
              </a>
            </div>
          </div>
        </div>
      </div>

      <!-- Pagination Controls -->
      <div
        th:if="${products.totalPages > 1}"
        class="d-flex flex-column flex-sm-row justify-content-between align-items-center mt-4 mb-5 gap-3"
      >
        <!-- Page Information -->
        <div class="text-muted small">
          Page
          <span class="fw-bold" th:text="${products.number + 1}"> 1 </span>
          of
          <span class="fw-bold" th:text="${products.totalPages}"> 1 </span>
          (
          <span th:text="${products.totalElements}"> 0 </span>
          products )
        </div>

        <!-- Pagination Buttons -->
        <nav aria-label="Product pagination">
          <ul class="pagination pagination-sm mb-0">
            <!-- First Page -->
            <li
              class="page-item"
              th:classappend="${products.first} ? 'disabled'"
            >
              <a class="page-link" th:href="@{/shop(page=0)}"> First </a>
            </li>

            <!-- Previous Page -->
            <li
              class="page-item"
              th:classappend="${!products.hasPrevious()} ? 'disabled'"
            >
              <a
                class="page-link"
                th:href="@{/shop(page=${products.number - 1})}"
              >
                Previous
              </a>
            </li>

            <!-- Page Numbers -->
            <li
              class="page-item"
              th:each="p : ${#numbers.sequence(0, products.totalPages - 1)}"
              th:classappend="${p == products.number} ? 'active'"
            >
              <a
                class="page-link"
                th:text="${p + 1}"
                th:href="@{/shop(page=${p})}"
              >
                1
              </a>
            </li>

            <!-- Next Page -->
            <li
              class="page-item"
              th:classappend="${!products.hasNext()} ? 'disabled'"
            >
              <a
                class="page-link"
                th:href="@{/shop(page=${products.number + 1})}"
              >
                Next
              </a>
            </li>

            <!-- Last Page -->
            <li
              class="page-item"
              th:classappend="${products.last} ? 'disabled'"
            >
              <a
                class="page-link"
                th:href="@{/shop(page=${products.totalPages - 1})}"
              >
                Last
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </main>

    <div th:replace="~{fragment/footer :: footer}"></div>
  </body>
</html>
