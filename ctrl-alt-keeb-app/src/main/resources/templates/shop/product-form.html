<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragment/head :: head('Add Keyboard')}"></head>

  <body>
    <header th:replace="~{fragment/header :: header}"></header>

    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card border-0 shadow-sm">
            <div class="card-body p-4 p-md-5">
              <div class="mb-4">
                <h1 class="mb-2">Add a Keyboard</h1>

                <p class="text-muted mb-0">
                  Enter the keyboard information below. The product will be
                  saved to the database.
                </p>
              </div>

              <form
                th:action="@{/products}"
                th:object="${product}"
                method="post"
                novalidate
              >
                <!-- General Validation Message -->
                <div
                  class="alert alert-danger"
                  role="alert"
                  th:if="${#fields.hasAnyErrors()}"
                >
                  Please correct the errors below and submit the form again.
                </div>

                <!-- Product Name -->
                <div class="mb-3">
                  <label for="name" class="form-label fw-semibold">
                    Product Name
                  </label>

                  <input
                    id="name"
                    type="text"
                    class="form-control"
                    th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                    th:field="*{name}"
                    placeholder="Example: Corne Wireless"
                  />

                  <div class="invalid-feedback" th:errors="*{name}">
                    Product name error
                  </div>
                </div>

                <!-- Description -->
                <div class="mb-3">
                  <label for="description" class="form-label fw-semibold">
                    Description
                  </label>

                  <textarea
                    id="description"
                    class="form-control"
                    rows="4"
                    th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''"
                    th:field="*{description}"
                    placeholder="Describe the keyboard and its main features"
                  ></textarea>

                  <div class="invalid-feedback" th:errors="*{description}">
                    Description error
                  </div>
                </div>

                <div class="row">
                  <!-- Price -->
                  <div class="col-md-6 mb-3">
                    <label for="price" class="form-label fw-semibold">
                      Price
                    </label>

                    <div class="input-group">
                      <span class="input-group-text">$</span>

                      <input
                        id="price"
                        type="number"
                        step="0.01"
                        min="0"
                        class="form-control"
                        th:classappend="${#fields.hasErrors('price')} ? 'is-invalid' : ''"
                        th:field="*{price}"
                        placeholder="199.99"
                      />

                      <div class="invalid-feedback" th:errors="*{price}">
                        Price error
                      </div>
                    </div>
                  </div>

                  <!-- Stock -->
                  <div class="col-md-6 mb-3">
                    <label for="stock" class="form-label fw-semibold">
                      Stock Quantity
                    </label>

                    <input
                      id="stock"
                      type="number"
                      min="0"
                      class="form-control"
                      th:classappend="${#fields.hasErrors('stock')} ? 'is-invalid' : ''"
                      th:field="*{stock}"
                      placeholder="10"
                    />

                    <div class="invalid-feedback" th:errors="*{stock}">
                      Stock error
                    </div>
                  </div>
                </div>

                <div class="row">
                  <!-- Layout -->
                  <div class="col-md-6 mb-3">
                    <label for="layout" class="form-label fw-semibold">
                      Keyboard Layout
                    </label>

                    <select
                      id="layout"
                      class="form-select"
                      th:classappend="${#fields.hasErrors('layout')} ? 'is-invalid' : ''"
                      th:field="*{layout}"
                    >
                      <option value="">Select a layout</option>

                      <option
                        th:each="layoutOption : ${layoutOptions}"
                        th:value="${layoutOption}"
                        th:text="${layoutOption}"
                      >
                        Layout
                      </option>
                    </select>

                    <div class="invalid-feedback" th:errors="*{layout}">
                      Layout error
                    </div>
                  </div>

                  <!-- Key Count -->
                  <div class="col-md-6 mb-3">
                    <label for="keyCount" class="form-label fw-semibold">
                      Number of Keys
                    </label>

                    <select
                      id="keyCount"
                      class="form-select"
                      th:classappend="${#fields.hasErrors('keyCount')} ? 'is-invalid' : ''"
                      th:field="*{keyCount}"
                    >
                      <option value="">Select the number of keys</option>

                      <option
                        th:each="keyCountOption : ${keyCountOptions}"
                        th:value="${keyCountOption}"
                        th:text="${keyCountOption + ' keys'}"
                      >
                        42 keys
                      </option>
                    </select>

                    <div class="invalid-feedback" th:errors="*{keyCount}">
                      Key count error
                    </div>
                  </div>
                </div>

                <!-- Image URL -->
                <div class="mb-4">
                  <label for="imageUrl" class="form-label fw-semibold">
                    Image URL
                    <span class="text-muted fw-normal"> (optional) </span>
                  </label>

                  <input
                    id="imageUrl"
                    type="url"
                    class="form-control"
                    th:classappend="${#fields.hasErrors('imageUrl')} ? 'is-invalid' : ''"
                    th:field="*{imageUrl}"
                    placeholder="https://example.com/keyboard.jpg"
                  />

                  <div class="invalid-feedback" th:errors="*{imageUrl}">
                    Image URL error
                  </div>
                </div>

                <!-- Buttons -->
                <div class="d-flex flex-wrap gap-2">
                  <button type="submit" class="btn btn-success">
                    Save Keyboard
                  </button>

                  <a th:href="@{/shop}" class="btn btn-outline-secondary">
                    Cancel
                  </a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer th:replace="~{fragment/footer :: footer}"></footer>
  </body>
</html>
