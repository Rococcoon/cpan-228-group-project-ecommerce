<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragment/head :: head('Checkout')}"></head>

<body>

<header th:replace="~{fragment/header :: header}"></header>

<main class="container py-5">

  <h1 class="mb-4">Checkout</h1>

  <div class="card shadow">

    <div class="card-body">

      <h3>Order Summary</h3>

      <table class="table">

        <thead class="table-dark">
          <tr>
            <th>Product</th>
            <th>Quantity</th>
            <th>Price</th>
            <th>Subtotal</th>
          </tr>
        </thead>

        <tbody>
          <tr th:each="item : ${cart.items}">
            <td th:text="${item.product.name}">
              Product
            </td>

            <td th:text="${item.quantity}">
              1
            </td>

            <td>
              $
              <span th:text="${item.product.price}">
                0
              </span>
            </td>

            <td>
              $
              <span th:text="${item.subtotal}">
                0
              </span>
            </td>
          </tr>
        </tbody>

      </table>

      <hr>

      <h4 class="text-end">
        Total:
        $
        <span th:text="${cart.total}">
          0
        </span>
      </h4>

      <hr>

      <h4 class="mb-3">Shipping Information</h4>

      <form th:action="@{/shop/order/place}" method="post">

        <div class="mb-3">
          <label for="shippingAddress" class="form-label">
            Shipping Address
          </label>

          <input
            type="text"
            id="shippingAddress"
            name="shippingAddress"
            class="form-control"
            required
          >
        </div>

        <div class="mb-3">
          <label for="phoneNumber" class="form-label">
            Phone Number
          </label>

          <input
            type="text"
            id="phoneNumber"
            name="phoneNumber"
            class="form-control"
            required
          >
        </div>

        <div class="text-end mt-4">
          <button
            type="submit"
            class="btn btn-primary btn-lg">
            Place Order
          </button>
        </div>

      </form>

    </div>

  </div>

</main>

<footer th:replace="~{fragment/footer :: footer}"></footer>

</body>

</html>
